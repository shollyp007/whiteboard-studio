<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whiteboard Studio</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: rgba(255,255,255,0.06);
      --surface-hover: rgba(255,255,255,0.11);
      --border: rgba(255,255,255,0.10);
      --text: #e8e8f0;
      --text-muted: #7a7a9a;
      --accent: #7c6eff;
      --accent2: #ff6eb4;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 8px 32px rgba(0,0,0,0.45);
      --canvas-bg: #ffffff;
    }
    .light-mode {
      --bg: #f0f0f8;
      --surface: rgba(255,255,255,0.75);
      --surface-hover: rgba(255,255,255,0.95);
      --border: rgba(0,0,0,0.09);
      --text: #1a1a2e;
      --text-muted: #888;
      --shadow: 0 8px 32px rgba(0,0,0,0.13);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background .3s, color .3s;
    }

    /* ── TOP BAR ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
      flex-shrink: 0;
    }
    #topbar .logo {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-right: 8px;
      letter-spacing: -0.5px;
    }
    .tb-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface); color: var(--text);
      font-size: 13px; cursor: pointer;
      transition: background .18s, transform .12s;
      white-space: nowrap;
    }
    .tb-btn:hover { background: var(--surface-hover); transform: translateY(-1px); }
    .tb-btn:active { transform: translateY(0); }
    .tb-btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tb-btn svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .spacer { flex: 1; }
    #canvasTitle { font-size:14px; color:var(--text-muted); font-weight:500; }

    /* ── LAYOUT ── */
    #workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── LEFT PANEL ── */
    #leftpanel {
      width: 68px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 14px 8px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border);
      z-index: 9;
      overflow-y: auto;
    }
    .tool-sep { width: 36px; height: 1px; background: var(--border); margin: 4px 0; }
    .tool-btn {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
      border: 1.5px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .18s;
      font-size: 20px;
      position: relative;
    }
    .tool-btn:hover { background: var(--surface-hover); color: var(--text); }
    .tool-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 16px rgba(124,110,255,0.4);
    }
    .tool-btn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .tool-label {
      position: absolute;
      left: 54px; top: 50%; transform: translateY(-50%);
      background: #1a1a2e; color: #fff;
      font-size: 11px; padding: 3px 8px; border-radius: 6px;
      white-space: nowrap; pointer-events: none;
      opacity: 0; transition: opacity .15s;
      z-index: 100;
    }
    .tool-btn:hover .tool-label { opacity: 1; }

    /* ── CANVAS AREA ── */
    #canvasArea {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: repeating-conic-gradient(#ddd 0% 25%, transparent 0% 50%) 0 0 / 20px 20px;
    }
    .light-mode #canvasArea {
      background: repeating-conic-gradient(#c8c8d8 0% 25%, #e8e8f4 0% 50%) 0 0 / 20px 20px;
    }
    #mainCanvas {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(1);
      cursor: crosshair;
      border-radius: 4px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      touch-action: none;
      transform-origin: center center;
    }
    #cursorCanvas {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* ── RIGHT PANEL ── */
    #rightpanel {
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 0;
      background: var(--surface);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      z-index: 9;
    }
    .panel-section {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--border);
    }
    .panel-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 10px;
    }

    /* Size slider */
    .size-preview {
      display: flex; align-items: center; justify-content: center;
      height: 40px; margin-bottom: 8px;
    }
    .size-dot {
      border-radius: 50%;
      background: var(--text);
      transition: width .15s, height .15s;
    }
    input[type=range] {
      width: 100%; accent-color: var(--accent);
      height: 4px; cursor: pointer;
    }
    .size-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--text-muted); margin-top:4px; }

    /* Opacity */
    #opacityVal { font-size:11px; color:var(--text-muted); text-align:right; margin-bottom:4px; }

    /* Color swatches */
    .color-grid {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px;
      margin-bottom: 10px;
    }
    .swatch {
      width: 100%; aspect-ratio: 1; border-radius: 6px;
      cursor: pointer; border: 2px solid transparent;
      transition: transform .15s, border-color .15s;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.active { border-color: var(--text); transform: scale(1.1); }

    /* Custom color + recent */
    .color-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    #colorPicker {
      width: 36px; height: 36px; border-radius: 8px; border: 2px solid var(--border);
      cursor: pointer; padding: 0; background: none;
    }
    #currentColorBox {
      flex: 1; height: 36px; border-radius: 8px;
      border: 2px solid var(--border);
      transition: background .15s;
    }
    .recent-colors { display:flex; gap:5px; flex-wrap:wrap; margin-top:4px; }
    .recent-dot {
      width: 22px; height: 22px; border-radius: 50%;
      cursor: pointer; border: 2px solid var(--border);
      transition: transform .15s;
    }
    .recent-dot:hover { transform: scale(1.2); }

    /* Bg color */
    .bg-presets { display:flex; gap:6px; flex-wrap:wrap; }
    .bg-swatch {
      width: 28px; height: 28px; border-radius: 6px;
      cursor: pointer; border: 2px solid var(--border);
      transition: transform .15s, border-color .15s;
    }
    .bg-swatch:hover { transform: scale(1.1); }
    .bg-swatch.active { border-color: var(--text); }

    /* Brush presets */
    .brush-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .brush-card {
      padding: 8px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      cursor: pointer; text-align: center;
      font-size: 11px; color: var(--text-muted);
      transition: all .18s;
    }
    .brush-card:hover { background: var(--surface-hover); color: var(--text); }
    .brush-card.active { border-color: var(--accent); color: var(--accent); background: rgba(124,110,255,0.1); }
    .brush-card .bicon { font-size: 20px; margin-bottom: 4px; }

    /* Shape picker */
    .shape-grid { display:grid; grid-template-columns: repeat(4,1fr); gap:6px; }
    .shape-btn {
      aspect-ratio:1; border-radius:8px; border:1.5px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; color:var(--text-muted); font-size:18px;
      transition:all .18s;
    }
    .shape-btn:hover { background:var(--surface-hover); color:var(--text); }
    .shape-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(124,110,255,.1); }
    .shape-btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; }

    /* ── TOAST ── */
    #toast {
      position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px);
      background:rgba(30,30,50,0.95); color:#fff; padding:10px 22px;
      border-radius:30px; font-size:13px; opacity:0;
      transition: opacity .25s, transform .25s; pointer-events:none; z-index:999;
      backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1);
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── ZOOM indicator ── */
    #zoomBadge {
      position:absolute; bottom:14px; right:14px;
      background:var(--surface); border:1px solid var(--border);
      backdrop-filter:blur(10px);
      padding:5px 12px; border-radius:20px; font-size:12px;
      color:var(--text-muted); z-index:8; pointer-events:none;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

    /* ── FONT PICKER ── */
    .font-search-wrap {
      position: relative; margin-bottom: 8px;
    }
    .font-search-wrap input {
      width: 100%; padding: 7px 30px 7px 10px;
      border-radius: var(--radius-sm); border: 1.5px solid var(--border);
      background: var(--surface-hover); color: var(--text);
      font-size: 12px; outline: none;
      transition: border-color .18s;
    }
    .font-search-wrap input:focus { border-color: var(--accent); }
    .font-search-wrap .refresh-btn {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; font-size: 15px; padding: 2px;
      transition: color .18s, transform .3s;
    }
    .font-search-wrap .refresh-btn:hover { color: var(--accent); }
    .font-search-wrap .refresh-btn.spinning { animation: spin .6s linear; }
    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    #fontList {
      max-height: 200px; overflow-y: auto;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      margin-bottom: 8px;
    }
    .font-item {
      padding: 7px 10px; cursor: pointer; font-size: 14px;
      border-bottom: 1px solid var(--border); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      transition: background .12s, color .12s;
      color: var(--text);
    }
    .font-item:last-child { border-bottom: none; }
    .font-item:hover { background: var(--surface-hover); }
    .font-item.active { background: rgba(124,110,255,0.15); color: var(--accent); }
    .font-status {
      padding: 10px; text-align: center; font-size: 11px;
      color: var(--text-muted);
    }

    #fontPreviewBox {
      padding: 8px 10px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: var(--surface-hover);
      font-size: 16px; margin-bottom: 8px; min-height: 38px;
      word-break: break-word; color: var(--text);
      transition: font-family .1s;
    }

    .font-style-row {
      display: flex; gap: 6px; margin-bottom: 8px; align-items: center;
    }
    .font-style-row label { font-size: 11px; color: var(--text-muted); }
    .fstyle-btn {
      width: 30px; height: 28px; border-radius: 7px;
      border: 1.5px solid var(--border); background: var(--surface);
      color: var(--text-muted); cursor: pointer; font-size: 13px;
      transition: all .18s; display:flex; align-items:center; justify-content:center;
    }
    .fstyle-btn:hover { background: var(--surface-hover); color: var(--text); }
    .fstyle-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(124,110,255,.12); }
    #fontSizeInput {
      width: 52px; padding: 4px 6px; border-radius: 7px;
      border: 1.5px solid var(--border); background: var(--surface-hover);
      color: var(--text); font-size: 12px; text-align: center; outline:none;
    }
    #fontSizeInput:focus { border-color: var(--accent); }

    /* ── IN-CANVAS TEXT OVERLAY ── */
    #textOverlay {
      display: none; position: absolute; z-index: 20;
      pointer-events: all;
    }
    #textInput {
      background: rgba(255,255,255,0.07);
      border: 2px dashed var(--accent);
      border-radius: 6px;
      color: inherit;
      outline: none; resize: none;
      padding: 4px 6px;
      min-width: 120px; min-height: 40px;
      backdrop-filter: blur(4px);
      line-height: 1.3;
    }
    .text-overlay-hint {
      font-size: 10px; color: var(--text-muted);
      margin-top: 4px; text-align: center;
    }

    /* Rainbow animation for active rainbow brush */
    @keyframes rainbow-shift {
      0%   { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }
    .tool-btn.rainbow-active {
      animation: rainbow-shift 2s linear infinite;
      background: linear-gradient(135deg, #ff0000, #ff7700, #ffff00, #00ff00, #0000ff, #8b00ff);
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <span class="logo">✦ Whiteboard Studio</span>
  <span id="canvasTitle">Untitled Canvas</span>
  <div class="spacer"></div>

  <button class="tb-btn" onclick="undo()" title="Ctrl+Z">
    <svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M3 13A9 9 0 1 0 5.67 5.67"/></svg> Undo
  </button>
  <button class="tb-btn" onclick="redo()" title="Ctrl+Y">
    <svg viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M21 13A9 9 0 1 1 18.33 5.67"/></svg> Redo
  </button>
  <button class="tb-btn" onclick="clearCanvas()">
    <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg> Clear
  </button>
  <button class="tb-btn" onclick="importImage()">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> Import
  </button>
  <button class="tb-btn accent" onclick="saveCanvas()">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Save
  </button>
  <button class="tb-btn" onclick="toggleMode()" id="modeBtn">🌙 Dark</button>
</div>

<!-- WORKSPACE -->
<div id="workspace">

  <!-- LEFT TOOLS -->
  <div id="leftpanel">
    <button class="tool-btn active" data-tool="pen" onclick="selectTool('pen')">
      <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      <span class="tool-label">Pen</span>
    </button>
    <button class="tool-btn" data-tool="marker" onclick="selectTool('marker')">
      <svg viewBox="0 0 24 24"><path d="M20 14.66V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5.34"/><polygon points="18 2 22 6 12 16 8 16 8 12 18 2"/></svg>
      <span class="tool-label">Marker</span>
    </button>
    <button class="tool-btn" data-tool="brush" onclick="selectTool('brush')">
      <svg viewBox="0 0 24 24"><path d="M18 3a3 3 0 0 0-3 3l-7 7 3 3 7-7a3 3 0 0 0 0-6z"/><path d="M9 13c0 1.5-1.5 3-3 3S3 17.5 3 19h8l-2-6z"/></svg>
      <span class="tool-label">Brush</span>
    </button>
    <button class="tool-btn" data-tool="rainbow" onclick="selectTool('rainbow')">
      <span style="font-size:22px">🌈</span>
      <span class="tool-label">Rainbow</span>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="eraser" onclick="selectTool('eraser')">
      <svg viewBox="0 0 24 24"><path d="M20 20H7L3 16l13-13 8 8-4 9z"/><path d="M6 17l-3-3"/></svg>
      <span class="tool-label">Eraser</span>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="line" onclick="selectTool('line')">
      <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/></svg>
      <span class="tool-label">Line</span>
    </button>
    <button class="tool-btn" data-tool="rect" onclick="selectTool('rect')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      <span class="tool-label">Rectangle</span>
    </button>
    <button class="tool-btn" data-tool="circle" onclick="selectTool('circle')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
      <span class="tool-label">Circle</span>
    </button>
    <button class="tool-btn" data-tool="arrow" onclick="selectTool('arrow')">
      <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      <span class="tool-label">Arrow</span>
    </button>
    <button class="tool-btn" data-tool="text" onclick="selectTool('text')">
      <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      <span class="tool-label">Text</span>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="fill" onclick="selectTool('fill')">
      <svg viewBox="0 0 24 24"><path d="M19 11l-8-8-8.5 8.5a5.5 5.5 0 0 0 7.78 7.78L19 11z"/><path d="M20 23c1.1 0 2-.9 2-2 0-1.1-2-4-2-4s-2 2.9-2 4c0 1.1.9 2 2 2z"/></svg>
      <span class="tool-label">Fill</span>
    </button>
  </div>

  <!-- CANVAS -->
  <div id="canvasArea">
    <canvas id="mainCanvas"></canvas>
    <canvas id="cursorCanvas"></canvas>
    <div id="zoomBadge">100%</div>
    <!-- In-canvas text editor -->
    <div id="textOverlay">
      <textarea id="textInput" rows="1" placeholder="Type here…"></textarea>
      <div class="text-overlay-hint">Enter to commit · Esc to cancel</div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="rightpanel">

    <!-- Brush Type -->
    <div class="panel-section">
      <div class="panel-label">Brush Style</div>
      <div class="brush-grid">
        <div class="brush-card active" data-brush="round" onclick="selectBrush('round')">
          <div class="bicon">●</div>Round
        </div>
        <div class="brush-card" data-brush="square" onclick="selectBrush('square')">
          <div class="bicon">■</div>Square
        </div>
        <div class="brush-card" data-brush="calligraphy" onclick="selectBrush('calligraphy')">
          <div class="bicon">✒️</div>Calligraphy
        </div>
        <div class="brush-card" data-brush="spray" onclick="selectBrush('spray')">
          <div class="bicon">💨</div>Spray
        </div>
      </div>
    </div>

    <!-- Size -->
    <div class="panel-section">
      <div class="panel-label">Brush Size</div>
      <div class="size-preview">
        <div class="size-dot" id="sizeDot" style="width:8px;height:8px"></div>
      </div>
      <input type="range" id="sizeSlider" min="1" max="80" value="8" oninput="updateSize(this.value)">
      <div class="size-labels"><span>1px</span><span>80px</span></div>
    </div>

    <!-- Opacity -->
    <div class="panel-section">
      <div class="panel-label">Opacity</div>
      <div id="opacityVal">100%</div>
      <input type="range" id="opacitySlider" min="5" max="100" value="100" oninput="updateOpacity(this.value)">
    </div>

    <!-- Stroke / Fill toggle -->
    <div class="panel-section">
      <div class="panel-label">Shape Mode</div>
      <div style="display:flex;gap:8px">
        <button class="brush-card active" id="strokeModeBtn" style="flex:1" onclick="setShapeMode('stroke')">Stroke</button>
        <button class="brush-card" id="fillModeBtn" style="flex:1" onclick="setShapeMode('fill')">Fill</button>
      </div>
    </div>

    <!-- Colors -->
    <div class="panel-section">
      <div class="panel-label">Colors</div>
      <div class="color-grid" id="swatchGrid"></div>
      <div class="color-row">
        <input type="color" id="colorPicker" value="#7c6eff" oninput="setColor(this.value)">
        <div id="currentColorBox" style="background:#7c6eff"></div>
      </div>
      <div class="panel-label" style="margin-top:8px">Recent</div>
      <div class="recent-colors" id="recentColors"></div>
    </div>

    <!-- Background -->
    <div class="panel-section">
      <div class="panel-label">Canvas Background</div>
      <div class="bg-presets" id="bgPresets"></div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:8px">
        <input type="color" id="bgColorPicker" value="#ffffff" oninput="setBgColor(this.value)" style="width:36px;height:36px;border-radius:8px;border:2px solid var(--border);cursor:pointer;padding:0">
        <span style="font-size:11px;color:var(--text-muted)">Custom BG</span>
      </div>
    </div>

    <!-- Fonts -->
    <div class="panel-section">
      <div class="panel-label" style="display:flex;justify-content:space-between;align-items:center">
        <span>Text Font</span>
        <span id="fontCount" style="font-size:10px;color:var(--text-muted)"></span>
      </div>

      <!-- Search + refresh -->
      <div class="font-search-wrap">
        <input type="text" id="fontSearch" placeholder="Search fonts…" oninput="filterFonts(this.value)">
        <button class="refresh-btn" id="refreshBtn" onclick="loadLocalFonts(true)" title="Reload system fonts">⟳</button>
      </div>

      <!-- Load system fonts button (shown before first load) -->
      <div id="fontLoadPrompt">
        <button class="tb-btn" style="width:100%;justify-content:center;margin-bottom:8px" onclick="loadLocalFonts(false)">
          Load System Fonts
        </button>
      </div>

      <!-- Font list -->
      <div id="fontList"><div class="font-status">Click "Load System Fonts" above</div></div>

      <!-- Preview -->
      <div id="fontPreviewBox" style="font-family:sans-serif">Hello World</div>

      <!-- Size + Bold/Italic -->
      <div class="font-style-row">
        <label>Size</label>
        <input type="number" id="fontSizeInput" value="32" min="6" max="400" oninput="updateFontSize(this.value)">
        <button class="fstyle-btn" id="boldBtn" onclick="toggleBold()" title="Bold"><b>B</b></button>
        <button class="fstyle-btn" id="italicBtn" onclick="toggleItalic()" title="Italic"><i>I</i></button>
        <button class="fstyle-btn" id="underlineBtn" onclick="toggleUnderline()" title="Underline" style="text-decoration:underline">U</button>
      </div>
    </div>

    <!-- Zoom -->
    <div class="panel-section">
      <div class="panel-label">Zoom</div>
      <div style="display:flex;gap:6px">
        <button class="tb-btn" style="flex:1;justify-content:center;padding:6px" onclick="zoomBy(-0.1)">−</button>
        <button class="tb-btn" style="flex:1;justify-content:center;padding:6px;font-size:11px" onclick="resetZoom()">Reset</button>
        <button class="tb-btn" style="flex:1;justify-content:center;padding:6px" onclick="zoomBy(0.1)">+</button>
      </div>
    </div>

  </div>
</div>

<!-- Hidden file input -->
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(event)">
<div id="toast"></div>

<script>
// ── STATE ──
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const cursorCanvas = document.getElementById('cursorCanvas');
const cursorCtx = cursorCanvas.getContext('2d');

let tool = 'pen';
let brushStyle = 'round';
let color = '#7c6eff';
let bgColor = '#ffffff';
let size = 8;
let opacity = 1;
let shapeMode = 'stroke';
let isDrawing = false;
let startX, startY, lastX, lastY;
let rainbowHue = 0;
let history = [];
let redoStack = [];
let zoom = 1;
let zoomOffsetX = 0, zoomOffsetY = 0;
let recentColors = [];
let pressure = 1;
let points = [];

// ── INIT ──
function init() {
  resizeCanvas();
  fillBackground();
  renderSwatches();
  renderBgSwatches();
  updateSizeDot();
  updateFontPreview();
  saveHistory();
  setupCursorCanvas();
  window.addEventListener('resize', () => { setupCursorCanvas(); });
}

function resizeCanvas() {
  const area = document.getElementById('canvasArea');
  const w = Math.min(area.clientWidth - 60, 1400);
  const h = Math.min(area.clientHeight - 60, 900);
  const prev = ctx.getImageData(0,0,canvas.width,canvas.height);
  canvas.width = w; canvas.height = h;
  fillBackground();
  ctx.putImageData(prev, 0, 0);
  updateCanvasTransform();
}

function setupCursorCanvas() {
  const area = document.getElementById('canvasArea');
  cursorCanvas.width = area.clientWidth;
  cursorCanvas.height = area.clientHeight;
}

function fillBackground() {
  ctx.save();
  ctx.fillStyle = bgColor;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.restore();
}

// ── CANVAS POSITION HELPERS ──
function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) / zoom,
    y: (clientY - rect.top) / zoom
  };
}

function updateCanvasTransform() {
  canvas.style.transform = `translate(-50%, -50%) scale(${zoom})`;
  document.getElementById('zoomBadge').textContent = Math.round(zoom*100) + '%';
}

// ── TOOLS ──
function selectTool(t) {
  tool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active','rainbow-active'));
  const btn = document.querySelector(`[data-tool="${t}"]`);
  if (btn) {
    btn.classList.add('active');
    if (t === 'rainbow') btn.classList.add('rainbow-active');
  }
  canvas.style.cursor = t === 'eraser' ? 'cell' : t === 'fill' ? 'copy' : t === 'text' ? 'text' : 'crosshair';
}

function selectBrush(b) {
  brushStyle = b;
  document.querySelectorAll('.brush-card[data-brush]').forEach(el => el.classList.remove('active'));
  document.querySelector(`[data-brush="${b}"]`).classList.add('active');
}

// ── DRAW EVENTS ──
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('mouseleave', onUp);
canvas.addEventListener('touchstart', e => { e.preventDefault(); onDown(e); }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); onMove(e); }, {passive:false});
canvas.addEventListener('touchend', e => { e.preventDefault(); onUp(e); }, {passive:false});

function onDown(e) {
  const pos = canvasPos(e);
  startX = pos.x; startY = pos.y;
  lastX = pos.x; lastY = pos.y;
  points = [{x:pos.x,y:pos.y}];
  isDrawing = true;
  if (tool === 'fill') { floodFill(Math.round(pos.x), Math.round(pos.y)); return; }
  if (tool === 'text') { addText(pos.x, pos.y); return; }
  ctx.save();
  ctx.globalAlpha = opacity;
  if (tool === 'eraser') { ctx.globalCompositeOperation = 'destination-out'; }
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
}

function onMove(e) {
  const pos = canvasPos(e);
  drawCursor(e);
  if (!isDrawing) return;
  if (tool === 'fill' || tool === 'text') return;
  if (['line','rect','circle','arrow'].includes(tool)) {
    // Shape preview — redraw from history snapshot
    ctx.restore(); ctx.save();
    drawShapePreview(startX, startY, pos.x, pos.y);
    return;
  }
  points.push({x:pos.x, y:pos.y});
  const dx = pos.x - lastX, dy = pos.y - lastY;
  const speed = Math.sqrt(dx*dx + dy*dy);
  pressure = Math.max(0.3, Math.min(1, 1 - speed/60));
  drawStroke(lastX, lastY, pos.x, pos.y);
  lastX = pos.x; lastY = pos.y;
}

function onUp(e) {
  if (!isDrawing) return;
  isDrawing = false;
  if (['line','rect','circle','arrow'].includes(tool) && e) {
    const pos = canvasPos(e);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = opacity;
    drawShape(startX, startY, pos.x, pos.y);
    ctx.restore();
  } else {
    ctx.restore();
  }
  addRecentColor(color);
  saveHistory();
}

// ── STROKE DRAWING ──
function drawStroke(x1, y1, x2, y2) {
  const c = getCurrentColor();
  ctx.globalAlpha = opacity;
  if (brushStyle === 'spray') { drawSpray(x2, y2, c); return; }
  ctx.strokeStyle = c;
  ctx.lineWidth = getCurrentSize();
  ctx.lineCap = brushStyle === 'square' ? 'square' : 'round';
  ctx.lineJoin = 'round';
  if (brushStyle === 'calligraphy') {
    ctx.lineWidth = getCurrentSize() * 0.3;
    ctx.save();
    ctx.translate(x2, y2);
    ctx.rotate(-Math.PI/6);
    ctx.fillStyle = c;
    ctx.fillRect(-getCurrentSize()*0.8, -getCurrentSize()*0.15, getCurrentSize()*1.6, getCurrentSize()*0.3);
    ctx.restore();
    return;
  }
  if (tool === 'marker') {
    ctx.globalAlpha = opacity * 0.6;
    ctx.lineWidth = getCurrentSize() * 1.4;
  }
  const pts = points;
  if (pts.length < 3) {
    ctx.lineTo(x2, y2);
    ctx.stroke();
  } else {
    const p0 = pts[pts.length-3];
    const p1 = pts[pts.length-2];
    const p2 = pts[pts.length-1];
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.quadraticCurveTo(p1.x, p1.y, (p1.x+p2.x)/2, (p1.y+p2.y)/2);
    ctx.stroke();
  }
  if (tool === 'rainbow') rainbowHue = (rainbowHue + 3) % 360;
}

function drawSpray(x, y, c) {
  const density = 30;
  const r = getCurrentSize() * 1.5;
  ctx.fillStyle = c;
  for (let i=0; i<density; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * r;
    ctx.beginPath();
    ctx.arc(x + Math.cos(angle)*radius, y + Math.sin(angle)*radius, Math.random()*1.5, 0, Math.PI*2);
    ctx.fill();
  }
}

function getCurrentColor() {
  if (tool === 'rainbow') return `hsl(${rainbowHue},100%,55%)`;
  return color;
}

function getCurrentSize() {
  return size * pressure;
}

// ── SHAPES ──
function drawShapePreview(x1,y1,x2,y2) {
  if (history.length > 0) {
    const img = history[history.length-1];
    ctx.putImageData(img, 0, 0);
  }
  ctx.globalAlpha = opacity;
  drawShape(x1,y1,x2,y2);
}

function drawShape(x1,y1,x2,y2) {
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (tool === 'line') {
    ctx.beginPath();
    ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.stroke();
  } else if (tool === 'rect') {
    ctx.beginPath();
    ctx.rect(x1,y1,x2-x1,y2-y1);
    if (shapeMode === 'fill') ctx.fill(); else ctx.stroke();
  } else if (tool === 'circle') {
    ctx.beginPath();
    const rx = Math.abs(x2-x1)/2, ry = Math.abs(y2-y1)/2;
    ctx.ellipse(x1+(x2-x1)/2, y1+(y2-y1)/2, rx, ry, 0, 0, Math.PI*2);
    if (shapeMode === 'fill') ctx.fill(); else ctx.stroke();
  } else if (tool === 'arrow') {
    drawArrow(x1,y1,x2,y2);
  }
}

function drawArrow(x1,y1,x2,y2) {
  const angle = Math.atan2(y2-y1,x2-x1);
  const hs = Math.max(size*4, 18);
  ctx.beginPath();
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hs*Math.cos(angle-Math.PI/6), y2-hs*Math.sin(angle-Math.PI/6));
  ctx.lineTo(x2-hs*Math.cos(angle+Math.PI/6), y2-hs*Math.sin(angle+Math.PI/6));
  ctx.closePath(); ctx.fill();
}

// ── FLOOD FILL ──
function floodFill(sx, sy) {
  const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
  const data = imgData.data;
  const idx = (sy*canvas.width + sx)*4;
  const tr = data[idx], tg = data[idx+1], tb = data[idx+2], ta = data[idx+3];
  const fc = hexToRgb(color);
  if (tr===fc.r && tg===fc.g && tb===fc.b) return;
  const stack = [[sx,sy]];
  const visited = new Uint8Array(canvas.width*canvas.height);
  while (stack.length) {
    const [x,y] = stack.pop();
    if (x<0||x>=canvas.width||y<0||y>=canvas.height) continue;
    const i = (y*canvas.width+x)*4;
    if (visited[y*canvas.width+x]) continue;
    if (Math.abs(data[i]-tr)>30||Math.abs(data[i+1]-tg)>30||Math.abs(data[i+2]-tb)>30) continue;
    visited[y*canvas.width+x] = 1;
    data[i]=fc.r; data[i+1]=fc.g; data[i+2]=fc.b; data[i+3]=255;
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(imgData, 0, 0);
  saveHistory();
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

// ── TEXT TOOL ──
let selectedFont = '-apple-system, BlinkMacSystemFont, sans-serif';
let fontSize = 32;
let fontBold = false;
let fontItalic = false;
let fontUnderline = false;
let textOverlayX = 0, textOverlayY = 0;

function addText(x, y) {
  const overlay = document.getElementById('textOverlay');
  const input = document.getElementById('textInput');
  const canvasRect = canvas.getBoundingClientRect();
  const area = document.getElementById('canvasArea');
  const areaRect = area.getBoundingClientRect();

  // Position overlay at click point in the canvasArea coordinate space
  textOverlayX = x;
  textOverlayY = y;
  const screenX = canvasRect.left - areaRect.left + x * zoom;
  const screenY = canvasRect.top  - areaRect.top  + y * zoom;

  overlay.style.left = screenX + 'px';
  overlay.style.top  = screenY + 'px';
  overlay.style.display = 'block';

  const fStyle = `${fontItalic?'italic':'normal'} ${fontBold?'bold':'normal'} ${fontSize*zoom}px "${selectedFont}", sans-serif`;
  input.style.font       = fStyle;
  input.style.color      = color;
  input.style.opacity    = opacity;
  input.style.minWidth   = '120px';
  input.style.height     = 'auto';
  input.value = '';
  input.focus();
}

document.getElementById('textInput').addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeTextOverlay(); return; }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitText(); }
});
document.getElementById('textInput').addEventListener('blur', () => {
  // small delay so click-on-canvas doesn't race
  setTimeout(() => {
    if (document.getElementById('textOverlay').style.display !== 'none') commitText();
  }, 120);
});

function commitText() {
  const input = document.getElementById('textInput');
  const txt = input.value.trim();
  closeTextOverlay();
  if (!txt) return;
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.fillStyle = color;
  const fStyle = `${fontItalic?'italic':''} ${fontBold?'bold':''} ${fontSize}px "${selectedFont}", sans-serif`;
  ctx.font = fStyle.trim();
  ctx.textBaseline = 'top';
  const lines = txt.split('\n');
  const lineH = fontSize * 1.3;
  lines.forEach((line, i) => {
    ctx.fillText(line, textOverlayX, textOverlayY + i * lineH);
    if (fontUnderline) {
      const w = ctx.measureText(line).width;
      ctx.fillRect(textOverlayX, textOverlayY + i*lineH + fontSize + 2, w, Math.max(1, fontSize*0.07));
    }
  });
  ctx.restore();
  saveHistory();
}

function closeTextOverlay() {
  document.getElementById('textOverlay').style.display = 'none';
  document.getElementById('textInput').value = '';
}

// ── FONT CONTROLS ──
function updateFontSize(v) {
  fontSize = Math.max(6, Math.min(400, parseInt(v)||32));
  updateFontPreview();
}

function toggleBold() {
  fontBold = !fontBold;
  document.getElementById('boldBtn').classList.toggle('active', fontBold);
  updateFontPreview();
}

function toggleItalic() {
  fontItalic = !fontItalic;
  document.getElementById('italicBtn').classList.toggle('active', fontItalic);
  updateFontPreview();
}

function toggleUnderline() {
  fontUnderline = !fontUnderline;
  document.getElementById('underlineBtn').classList.toggle('active', fontUnderline);
}

function updateFontPreview() {
  const box = document.getElementById('fontPreviewBox');
  box.style.fontFamily  = `"${selectedFont}", sans-serif`;
  box.style.fontWeight  = fontBold   ? 'bold'   : 'normal';
  box.style.fontStyle   = fontItalic ? 'italic' : 'normal';
  box.style.fontSize    = Math.min(fontSize, 28) + 'px';
}

// ── SYSTEM FONT LOADING ──
let allFontFamilies = [];
let filteredFamilies = [];

async function loadLocalFonts(isRefresh = false) {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  document.getElementById('fontList').innerHTML = '<div class="font-status">Loading fonts…</div>';

  try {
    if (!('queryLocalFonts' in window)) {
      throw new Error('not-supported');
    }
    const fonts = await window.queryLocalFonts();
    // Deduplicate by family
    const seen = new Set();
    fonts.forEach(f => seen.add(f.family));
    allFontFamilies = [...seen].sort((a,b) => a.localeCompare(b));
    document.getElementById('fontLoadPrompt').style.display = 'none';
    toast(`${allFontFamilies.length} fonts loaded`);
  } catch(err) {
    if (err.message === 'not-supported') {
      toast('Local Font API not supported — using built-in list');
    } else if (err.name === 'NotAllowedError') {
      toast('Font access denied — check browser permissions');
      document.getElementById('fontList').innerHTML = '<div class="font-status">Permission denied.<br>Allow font access in browser settings.</div>';
      btn.classList.remove('spinning');
      return;
    } else {
      toast('Could not load fonts — using built-in list');
    }
    allFontFamilies = BUILTIN_FONTS;
    document.getElementById('fontLoadPrompt').style.display = 'none';
  }

  document.getElementById('fontCount').textContent = allFontFamilies.length + ' fonts';
  filterFonts(document.getElementById('fontSearch').value);
  btn.classList.remove('spinning');
}

function filterFonts(query) {
  const q = query.trim().toLowerCase();
  filteredFamilies = q
    ? allFontFamilies.filter(f => f.toLowerCase().includes(q))
    : allFontFamilies;
  renderFontList();
}

function renderFontList() {
  const list = document.getElementById('fontList');
  if (!filteredFamilies.length) {
    list.innerHTML = '<div class="font-status">No fonts found</div>';
    return;
  }
  // Render up to 300 items; virtual scroll would be overkill here
  const visible = filteredFamilies.slice(0, 300);
  list.innerHTML = '';
  visible.forEach(family => {
    const item = document.createElement('div');
    item.className = 'font-item' + (family === selectedFont ? ' active' : '');
    item.textContent = family;
    item.style.fontFamily = `"${family}", sans-serif`;
    item.title = family;
    item.onclick = () => pickFont(family);
    list.appendChild(item);
  });
  if (filteredFamilies.length > 300) {
    const more = document.createElement('div');
    more.className = 'font-status';
    more.textContent = `+${filteredFamilies.length - 300} more — type to filter`;
    list.appendChild(more);
  }
}

function pickFont(family) {
  selectedFont = family;
  document.querySelectorAll('.font-item').forEach(el =>
    el.classList.toggle('active', el.textContent === family)
  );
  updateFontPreview();
  toast(`Font: ${family}`);
}

// Built-in fallback list (common macOS + cross-platform fonts)
const BUILTIN_FONTS = [
  'American Typewriter','Arial','Arial Black','Arial Narrow','Arial Rounded MT Bold',
  'Avenir','Avenir Next','Avenir Next Condensed',
  'Baskerville','Big Caslon','Bodoni 72','Bodoni 72 Oldstyle','Bodoni 72 Smallcaps',
  'Bradley Hand','Brush Script MT',
  'Chalkboard SE','Chalkduster','Charter','Cochin','Comic Sans MS','Copperplate',
  'Courier New','Courier','Damascus',
  'DejaVu Sans','DejaVu Serif','Didot',
  'Futura','Geneva','Georgia','Gill Sans','Helvetica','Helvetica Neue',
  'Herculanum','Hiragino Mincho ProN','Hiragino Sans',
  'Hoefler Text','Impact','InaiMathi','Iowan Old Style',
  'Lucida Grande','Luminari','Marker Felt',
  'Menlo','Monaco','Noteworthy','Optima',
  'Palatino','Papyrus','Phosphate','Rockwell',
  'SF Pro','SF Pro Display','SF Pro Text','SF Mono',
  'Savoye LET','Seravek','SignPainter','Skia','Snell Roundhand',
  'Superclarendon','Symbol','Tahoma','Times New Roman','Trebuchet MS',
  'Verdana','Zapf Dingbats','Zapfino',
].sort();

// ── CURSOR ──
function drawCursor(e) {
  const area = document.getElementById('canvasArea');
  const rect = area.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  cursorCtx.clearRect(0,0,cursorCanvas.width,cursorCanvas.height);
  const r = (size/2)*zoom;
  cursorCtx.beginPath();
  cursorCtx.arc(cx,cy,Math.max(r,2),0,Math.PI*2);
  cursorCtx.strokeStyle = tool==='eraser'?'rgba(255,50,50,0.8)':'rgba(100,100,100,0.6)';
  cursorCtx.lineWidth = 1;
  cursorCtx.stroke();
}
document.getElementById('canvasArea').addEventListener('mouseleave',()=>{
  cursorCtx.clearRect(0,0,cursorCanvas.width,cursorCanvas.height);
});

// ── COLOR ──
const SWATCHES = [
  '#ff4d4d','#ff9500','#ffd60a','#34c759','#007aff','#5856d6',
  '#ff2d92','#00c7be','#30b0c7','#636366','#000000','#ffffff',
  '#ff6b6b','#ffa94d','#ffe066','#69db7c','#4dabf7','#9775fa',
  '#f06595','#38d9a9','#a9e34b','#495057','#343a40','#f8f9fa',
];

function renderSwatches() {
  const grid = document.getElementById('swatchGrid');
  grid.innerHTML = '';
  SWATCHES.forEach(c => {
    const s = document.createElement('div');
    s.className = 'swatch' + (c===color?' active':'');
    s.style.background = c;
    s.style.border = c==='#ffffff' ? '2px solid var(--border)' : '2px solid transparent';
    s.title = c;
    s.onclick = () => setColor(c);
    grid.appendChild(s);
  });
}

function setColor(c) {
  color = c;
  document.getElementById('colorPicker').value = c;
  document.getElementById('currentColorBox').style.background = c;
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.style.background === hexToRgbCss(c)));
}

function hexToRgbCss(hex) {
  const {r,g,b} = hexToRgb(hex);
  return `rgb(${r}, ${g}, ${b})`;
}

function addRecentColor(c) {
  if (c.startsWith('hsl')) return;
  recentColors = [c, ...recentColors.filter(x=>x!==c)].slice(0,8);
  renderRecent();
}

function renderRecent() {
  const el = document.getElementById('recentColors');
  el.innerHTML = '';
  recentColors.forEach(c => {
    const d = document.createElement('div');
    d.className = 'recent-dot';
    d.style.background = c;
    d.onclick = () => setColor(c);
    el.appendChild(d);
  });
}

// ── BG COLOR ──
const BG_PRESETS = ['#ffffff','#0f0f13','#fef9ef','#eef6ff','#f5f0ff','#fff0f0','#f0fff4','#fdf4ff'];

function renderBgSwatches() {
  const el = document.getElementById('bgPresets');
  el.innerHTML = '';
  BG_PRESETS.forEach(c => {
    const s = document.createElement('div');
    s.className = 'bg-swatch' + (c===bgColor?' active':'');
    s.style.background = c;
    s.style.border = c==='#ffffff'?'2px solid var(--border)':'2px solid transparent';
    s.onclick = () => setBgColor(c);
    el.appendChild(s);
  });
}

function setBgColor(c) {
  bgColor = c;
  document.getElementById('bgColorPicker').value = c;
  const oldData = ctx.getImageData(0,0,canvas.width,canvas.height);
  ctx.fillStyle = c;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.putImageData(oldData,0,0);
  document.querySelectorAll('.bg-swatch').forEach(s => s.classList.toggle('active', s.style.background===hexToRgbCss(c)));
  saveHistory();
}

// ── SIZE / OPACITY ──
function updateSize(v) {
  size = parseInt(v);
  updateSizeDot();
}

function updateSizeDot() {
  const d = document.getElementById('sizeDot');
  const s = Math.min(size, 60);
  d.style.width = s+'px'; d.style.height = s+'px';
}

function updateOpacity(v) {
  opacity = v/100;
  document.getElementById('opacityVal').textContent = v+'%';
}

function setShapeMode(m) {
  shapeMode = m;
  document.getElementById('strokeModeBtn').classList.toggle('active', m==='stroke');
  document.getElementById('fillModeBtn').classList.toggle('active', m==='fill');
}

// ── HISTORY ──
function saveHistory() {
  history.push(ctx.getImageData(0,0,canvas.width,canvas.height));
  if (history.length > 60) history.shift();
  redoStack = [];
}

function undo() {
  if (history.length <= 1) { toast('Nothing to undo'); return; }
  redoStack.push(history.pop());
  ctx.putImageData(history[history.length-1], 0, 0);
}

function redo() {
  if (!redoStack.length) { toast('Nothing to redo'); return; }
  const state = redoStack.pop();
  ctx.putImageData(state, 0, 0);
  history.push(state);
}

function clearCanvas() {
  if (!confirm('Clear the canvas?')) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  fillBackground();
  saveHistory();
  toast('Canvas cleared');
}

// ── ZOOM ──
function zoomBy(delta) {
  zoom = Math.max(0.2, Math.min(4, zoom + delta));
  updateCanvasTransform();
}

function resetZoom() {
  zoom = 1;
  updateCanvasTransform();
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 0.1 : -0.1);
}, {passive:false});

// ── IMPORT / SAVE ──
function importImage() {
  document.getElementById('fileInput').click();
}

function loadImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      ctx.globalAlpha = 0.5;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
      saveHistory();
      toast('Image imported as tracing layer');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function saveCanvas() {
  const link = document.createElement('a');
  link.download = 'whiteboard-' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  toast('Saved as PNG!');
}

// ── DARK/LIGHT MODE ──
let isDark = true;
function toggleMode() {
  isDark = !isDark;
  document.body.classList.toggle('light-mode', !isDark);
  document.getElementById('modeBtn').textContent = isDark ? '🌙 Dark' : '☀️ Light';
}

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key==='z') { e.preventDefault(); if(e.shiftKey) redo(); else undo(); }
    if (e.key==='y') { e.preventDefault(); redo(); }
    if (e.key==='s') { e.preventDefault(); saveCanvas(); }
  }
  const map = {'p':'pen','m':'marker','b':'brush','e':'eraser','r':'rainbow','l':'line','c':'circle','t':'text','f':'fill'};
  if (!e.ctrlKey && !e.metaKey && map[e.key]) selectTool(map[e.key]);
  if (e.key===']') updateSize(Math.min(80, size+2));
  if (e.key==='[') updateSize(Math.max(1, size-2));
});

// ── TOAST ──
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

init();
</script>
</body>
</html>
